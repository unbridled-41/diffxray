name: 7-Day 1000-Star Telemetry Tracker

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  telemetry:
    name: Record Live Star & Sprint Telemetry on Issue #8
    runs-on: ubuntu-latest
    steps:
      - name: Update Live Telemetry Dashboard on Issue #8
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = 8;
            const launchUtc = "2026-11-18T05:19:58Z";
            const deadlineUtc = "2026-11-25T05:19:58Z";
            const targetStars = 1000;

            const repoRes = await github.rest.repos.get({ owner, repo });
            const relRes = await github.rest.repos.listReleases({ owner, repo, per_page: 20 });

            let downloads = 0;
            for (const rel of relRes.data) {
              for (const asset of rel.assets || []) {
                downloads += asset.download_count || 0;
              }
            }

            const nowMs = Date.now();
            const elapsedH = Math.max(0.01, (nowMs - Date.parse(launchUtc)) / 3600000);
            const remainH = Math.max(0, 168 - elapsedH);
            const stars = repoRes.data.stargazers_count || 0;
            const forks = repoRes.data.forks_count || 0;
            const watchers = repoRes.data.subscribers_count || 0;
            const openIssues = repoRes.data.open_issues_count || 0;
            const pct = ((stars / targetStars) * 100).toFixed(2);
            const reqRate = remainH > 0 ? (Math.max(0, targetStars - stars) / remainH).toFixed(2) : "0.00";

            const sprintDone = elapsedH >= 168;
            const statusBanner = stars >= targetStars
              ? `TARGET ACHIEVED (${stars} / ${targetStars} Stars)`
              : sprintDone
              ? `168h Window Elapsed (${stars} / ${targetStars} Stars — Post-Sprint Iteration Active)`
              : `Sprint Active (${elapsedH.toFixed(1)}h / 168h elapsed · ${remainH.toFixed(1)}h remaining)`;

            const marker = "<!-- diffxray-growth-telemetry -->";
            const nowIso = new Date(nowMs).toISOString();

            const body = [
              marker,
              `## Live 7-Day 1,000-Star Telemetry Dashboard`,
              ``,
              `> **Status**: **${statusBanner}**  `,
              `> **Launch Baseline (\`v1.0.0\`)**: \`${launchUtc}\` (\`0\` Stars)  `,
              `> **168h Assessment Deadline**: \`${deadlineUtc}\`  `,
              `> **Last Automated Cloud Check**: \`${nowIso}\``,
              ``,
              `| Metric | Current Value | Target / Notes |`,
              `| --- | ---: | --- |`,
              `| **GitHub Stars** | **${stars}** | **1,000** (\`${pct}%\`) |`,
              `| **Required Velocity** | \`${reqRate} stars/hr\` | Across remaining \`${remainH.toFixed(1)}h\` |`,
              `| **Forks** | ${forks} | Organic developer forks |`,
              `| **Watchers** | ${watchers} | Repository subscribers |`,
              `| **Release Asset Downloads** | ${downloads} | Standalone Studio & SVG downloads |`,
              `| **Open Issues / PRs** | ${openIssues} | Community feedback queue |`,
              ``,
              `<sub>Updated automatically every 6 hours via \`.github/workflows/growth-telemetry.yml\` (and on-demand via \`workflow_dispatch\`).</sub>`
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
